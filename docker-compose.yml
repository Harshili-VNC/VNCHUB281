services:
  postgres:
    image: postgres:16-alpine
    container_name: vnc-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vnc
      POSTGRES_PASSWORD: vnc_dev_password
      POSTGRES_DB: vnc_hub
    ports:
      - "55432:5432"
    volumes:
      - vnc_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnc -d vnc_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vnc_hub_pgdata:
